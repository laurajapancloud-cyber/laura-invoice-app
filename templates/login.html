<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>LAURA INVOICE - ログイン</title>
    <script>
        try {
            const storedTheme = localStorage.getItem('laura-theme');
            const prefersLight = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches;
            const theme = storedTheme || (prefersLight ? 'light' : 'dark');
            if (theme === 'light') document.documentElement.setAttribute('data-theme', 'light');
        } catch (e) {}
    </script>
    <style>
        @font-face {
            font-family: 'Inter';
            font-style: normal;
            font-weight: 400;
            font-display: swap;
            src: local('Inter'), url('/static/fonts/inter-400.woff2') format('woff2');
        }
        @font-face {
            font-family: 'Inter';
            font-style: normal;
            font-weight: 500;
            font-display: swap;
            src: local('Inter Medium'), url('/static/fonts/inter-500.woff2') format('woff2');
        }
        @font-face {
            font-family: 'Inter';
            font-style: normal;
            font-weight: 700;
            font-display: swap;
            src: local('Inter Bold'), url('/static/fonts/inter-700.woff2') format('woff2');
        }
        @font-face {
            font-family: 'Cormorant Garamond';
            font-style: normal;
            font-weight: 600;
            font-display: swap;
            src: local('Cormorant Garamond SemiBold'), url('/static/fonts/cormorant-garamond-600.woff2') format('woff2');
        }
        @font-face {
            font-family: 'Cormorant Garamond';
            font-style: normal;
            font-weight: 700;
            font-display: swap;
            src: local('Cormorant Garamond Bold'), url('/static/fonts/cormorant-garamond-700.woff2') format('woff2');
        }
        @font-face {
            font-family: 'Noto Sans JP';
            font-style: normal;
            font-weight: 400;
            font-display: swap;
            src: local('Noto Sans JP'), url('/static/fonts/noto-sans-jp-400.woff2') format('woff2');
        }
        @font-face {
            font-family: 'Noto Sans JP';
            font-style: normal;
            font-weight: 500;
            font-display: swap;
            src: local('Noto Sans JP Medium'), url('/static/fonts/noto-sans-jp-500.woff2') format('woff2');
        }
        @font-face {
            font-family: 'Noto Sans JP';
            font-style: normal;
            font-weight: 700;
            font-display: swap;
            src: local('Noto Sans JP Bold'), url('/static/fonts/noto-sans-jp-700.woff2') format('woff2');
        }

        :root {
            --bg-base: #0c0d10;
            --bg-elevated: #16181e;
            --bg-card: #1c1c21;
            --bg-input: #0f1115;
            --text-primary: #f5f3ed;
            --text-secondary: #b7b3a8;
            --text-muted: #807c70;
            --border: rgba(255, 255, 255, 0.12);
            --border-strong: rgba(236, 209, 148, 0.32);
            --gold: #d2ab63;
            --gold-bright: #ecd194;
            --gold-deep: #9a7d42;
            --gold-soft: rgba(210, 171, 99, 0.14);
        }

        :root[data-theme="light"] {
            --bg-base: #f7f5f0;
            --bg-elevated: #ffffff;
            --bg-card: #ffffff;
            --bg-input: #ffffff;
            --text-primary: #2a261f;
            --text-secondary: #575141;
            --text-muted: #6e6552;
            --border: rgba(168, 137, 63, 0.35);
            --border-strong: rgba(168, 137, 63, 0.6);
            --gold: #a8893f;
            --gold-bright: #c9a961;
            --gold-deep: #7a6327;
            --gold-soft: rgba(168, 137, 63, 0.15);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', 'Noto Sans JP', -apple-system, BlinkMacSystemFont, sans-serif;
            background: radial-gradient(circle at 50% 0%, rgba(210,171,99,0.12), var(--bg-base) 60%);
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100dvh;
            padding: calc(16px + env(safe-area-inset-top, 0px)) 16px calc(16px + env(safe-area-inset-bottom, 0px));
        }

        :root[data-theme="light"] body {
            background: radial-gradient(ellipse 80% 50% at 50% -10%, rgba(168, 137, 63, 0.10), transparent 60%), var(--bg-base);
        }

        .login-card {
            background: var(--bg-elevated);
            border: 1px solid var(--border-strong);
            border-radius: 18px;
            padding: 40px 36px;
            width: 100%;
            max-width: 400px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.45), 0 0 20px var(--gold-soft);
            text-align: center;
        }

        :root[data-theme="light"] .login-card {
            box-shadow: 0 12px 36px rgba(42, 38, 31, 0.08), 0 2px 10px rgba(168, 137, 63, 0.08);
        }

        @media (max-width: 480px) {
            .login-card {
                padding: 36px 24px;
            }
        }

        .logo-mark {
            font-family: 'Cormorant Garamond', serif;
            font-size: 32px;
            font-weight: 600;
            color: var(--gold);
            margin-bottom: 8px;
            letter-spacing: 0.14em;
        }

        :root[data-theme="light"] .logo-mark {
            color: var(--gold-deep);
        }

        .logo-sub {
            font-size: 10px;
            color: var(--text-muted);
            letter-spacing: 0.3em;
            margin-bottom: 36px;
        }

        .input-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .input-group label {
            display: block;
            font-size: 12px;
            font-weight: 500;
            color: var(--text-secondary);
            margin-bottom: 8px;
            letter-spacing: 0.05em;
        }

        .input-group input {
            width: 100%;
            font-family: inherit;
            background: var(--bg-input);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 14px 16px;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.2s;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--gold);
            box-shadow: 0 0 0 3px var(--gold-soft);
        }

        .btn {
            width: 100%;
            font-family: inherit;
            background: linear-gradient(135deg, var(--gold-bright), var(--gold-deep));
            color: #17130a;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s;
            margin-top: 10px;
        }

        :root[data-theme="light"] .btn {
            background: linear-gradient(180deg, #d8b86a 0%, #b38e3d 100%);
            color: #ffffff;
        }

        .btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(201,169,97,0.3);
        }

        .error-msg {
            color: #e06157;
            font-size: 13px;
            margin-bottom: 20px;
            background: rgba(224,97,87,0.1);
            border: 1px solid rgba(224,97,87,0.3);
            padding: 10px;
            border-radius: 8px;
            display: {% if error %}block{% else %}none{% endif %};
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo-mark">LAURA JAPAN</div>
        <div class="logo-sub">INVOICE SYSTEM</div>

        <div class="error-msg">{{ error }}</div>

        <form method="POST" action="/login">
            <div class="input-group">
                <label>ユーザーID</label>
                <input type="text" name="username" required autocomplete="username">
            </div>
            <div class="input-group">
                <label>パスワード</label>
                <input type="password" name="password" required autocomplete="current-password">
            </div>
            <button type="submit" class="btn">ログイン</button>
        </form>
    </div>
</body>
</html>
